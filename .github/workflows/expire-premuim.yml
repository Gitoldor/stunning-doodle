name: Expire Premium Posts

on:
  schedule:
    # Every day at 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire-premium-posts:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Remove expired Premium posts
        run: |

          node -e '

          const fs = require("fs");

          const vm = require("vm");


          // ========================================
          // SETTINGS
          // ========================================

          const FILE = "data.js";

          const PREMIUM_DAYS = 30;


          console.log("================================");
          console.log("PREMIUM EXPIRY CHECK");
          console.log("================================");


          // ========================================
          // CHECK FILE
          // ========================================

          if (!fs.existsSync(FILE)) {

            console.error(
              "ERROR: data.js not found."
            );

            process.exit(1);

          }


          // ========================================
          // READ FILE
          // ========================================

          let content =
            fs.readFileSync(
              FILE,
              "utf8"
            );


          // ========================================
          // REMOVE BROWSER-ONLY CODE
          // ========================================

          content =
            content.replace(
              /window\.superAttributes\s*=\s*superAttributes\s*;/g,
              ""
            );

          content =
            content.replace(
              /window\.posts\s*=\s*posts\s*;/g,
              ""
            );


          // ========================================
          // READ POSTS
          // ========================================

          const sandbox = {};

          try {

            vm.runInNewContext(
              content +
              "\nresult = posts;",
              sandbox
            );

          } catch (error) {

            console.error(
              "ERROR: Could not read posts."
            );

            console.error(
              error.message
            );

            process.exit(1);

          }


          const posts =
            sandbox.result;


          // ========================================
          // VALIDATE
          // ========================================

          if (!Array.isArray(posts)) {

            console.error(
              "ERROR: posts is not an array."
            );

            process.exit(1);

          }


          console.log(
            "Posts found:",
            posts.length
          );


          // ========================================
          // CURRENT TIME
          // ========================================

          const now =
            new Date();


          // ========================================
          // FILTER POSTS
          // ========================================

          const remainingPosts = [];


          for (const post of posts) {


            // ----------------------------------------
            // NOT PREMIUM
            // ----------------------------------------

            if (
              post.plan2 !== "Premium"
            ) {

              console.log(
                "KEEP:",
                post.id,
                "- Not Premium"
              );

              remainingPosts.push(
                post
              );

              continue;

            }


            // ----------------------------------------
            // NO DATE
            // ----------------------------------------

            if (!post.createdAt) {

              console.log(
                "KEEP:",
                post.id,
                "- No createdAt"
              );

              remainingPosts.push(
                post
              );

              continue;

            }


            // ----------------------------------------
            // CREATED DATE
            // ----------------------------------------

            const created =
              new Date(
                post.createdAt +
                "T00:00:00Z"
              );


            if (
              Number.isNaN(
                created.getTime()
              )
            ) {

              console.log(
                "KEEP:",
                post.id,
                "- Invalid date"
              );

              remainingPosts.push(
                post
              );

              continue;

            }


            // ----------------------------------------
            // EXPIRY DATE
            // ----------------------------------------

            const expiry =
              new Date(
                created.getTime() +
                PREMIUM_DAYS *
                24 *
                60 *
                60 *
                1000
              );


            // ----------------------------------------
            // EXPIRED
            // ----------------------------------------

            if (
              now >= expiry
            ) {

              console.log(
                "DELETE:",
                post.id,
                "| Created:",
                post.createdAt,
                "| Expired:",
                expiry.toISOString()
              );

            }

            else {

              console.log(
                "KEEP:",
                post.id,
                "| Expires:",
                expiry.toISOString()
              );

              remainingPosts.push(
                post
              );

            }

          }


          // ========================================
          // COUNT
          // ========================================

          const deleted =
            posts.length -
            remainingPosts.length;


          console.log("");
          console.log(
            "Before:",
            posts.length
          );

          console.log(
            "After:",
            remainingPosts.length
          );

          console.log(
            "Deleted:",
            deleted
          );


          // ========================================
          // NOTHING TO DELETE
          // ========================================

          if (deleted === 0) {

            console.log(
              "Nothing expired."
            );

            process.exit(0);

          }


          // ========================================
          // REPLACE POSTS ARRAY ONLY
          // ========================================

          const newPosts =
            JSON.stringify(
              remainingPosts,
              null,
              2
            );


          const updatedContent =
            content.replace(
              /const\s+posts\s*=\s*\[[\s\S]*?\];/,
              "const posts = " +
              newPosts +
              ";"
            );


          // ========================================
          // RESTORE BROWSER CODE
          // ========================================

          const finalContent =
            updatedContent +

            "\n\n// ================================\n" +

            "// MAKE AVAILABLE TO HTML\n" +

            "// ================================\n\n" +

            "window.superAttributes = superAttributes;\n" +

            "window.posts = posts;\n";


          // ========================================
          // SAVE
          // ========================================

          fs.writeFileSync(
            FILE,
            finalContent,
            "utf8"
          );


          console.log(
            "data.js updated successfully."
          );

          '


      # ========================================
      # COMMIT
      # ========================================

      - name: Commit changes
        run: |

          if git diff --quiet -- data.js; then

            echo "No changes to commit."

            exit 0

          fi


          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data.js


          git commit \
            -m "Automatically remove expired Premium posts"


          git push
